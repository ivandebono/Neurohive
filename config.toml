# Neurohive pipeline configuration
# ------------------------------------
# Values here are project defaults. Override them in three ways (highest priority first):
#   1. CLI flags:           --model, --node-top-k, --chunk-top-k, etc.
#   2. Environment / .env:  ANTHROPIC_MODEL, ANTHROPIC_API_KEY
#   3. This file:           the values below

[paths]
# Relative to the repository root unless absolute.
data_dir   = "data"
env_file   = ".env"
logs_dir   = "logs"
models_dir = "models"

[pipeline]
# Number of taxonomy nodes and paper chunks fetched by the retriever per query.
node_top_k  = 6
chunk_top_k = 6

# Minimum edge confidence for graph expansion.  Edges below this threshold are
# not followed during smart_expand().  Hierarchy edges (HAS_SUBPILLAR,
# HAS_RESEARCH_AREA) always have confidence 1.0 and are unaffected.  The
# threshold mainly filters weak RELATED_TO edges (range 0.70–0.92, all semantic).
# Set to 0.0 to disable filtering and follow all edges regardless of confidence.
confidence_threshold = 0.8

[retrieval]
# BM25 Okapi hyperparameters.
bm25_k1 = 1.5
bm25_b  = 0.75

# Reciprocal Rank Fusion constants. Lower values sharpen rank differences.
node_rrf_k  = 30
chunk_rrf_k = 60

# Chunks sharing a DOI with a top-k seed receive at least this fraction of the
# seed paper's best score.
sibling_discount = 0.5

# Retrieval cache artifacts written under data/database/ during --ingest.
bm25_cache_version = 1
bm25_meta_file     = "bm25_meta.json"
node_bm25_file     = "node_bm25.json"
chunk_bm25_file    = "chunk_bm25.json"
emb_meta_file      = "emb_meta.json"
node_emb_file      = "node_embs.npy"
chunk_emb_file     = "chunk_embs.npy"

[anthropic]
# Anthropic model ID.
# Override with the ANTHROPIC_MODEL environment variable or the --model CLI flag.
model = "claude-haiku-4-5-20251001"

[embeddings]
# sentence-transformers model used for hybrid BM25 + dense retrieval.
# The model is saved to models/<model_name>/ by scripts/download_model.py.
# Change this only if you want a different embedding model; the download
# script reads this value automatically.
model = "sentence-transformers/all-MiniLM-L6-v2"

[nli]
# Cross-encoder model for post-generation entailment verification.
# For each cited claim in the answer, the model checks whether the claim is
# entailed by the actual source text (PaperChunk.text or Node.description).
# Enabled at runtime with --verify or verify_entailment=True.
# Requires: make setup-nli && make download-nli-model
#
# Recommended model (best quality/speed balance on CPU, ~568 MB):
model = "cross-encoder/nli-deberta-v3-small"
#
# Faster alternatives (lower accuracy):
#   "cross-encoder/nli-deberta-v3-xsmall"   ~283 MB  — good balance
#   "cross-encoder/nli-MiniLM2-L6-H768"     ~328 MB  — very popular
#   "cross-encoder/nli-distilroberta-base"  ~328 MB  — stable, widely used
#
# Minimum entailment probability (post-softmax) for a claim to pass.
# Claims below this threshold emit a UserWarning.
entailment_threshold = 0.5
