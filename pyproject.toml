[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurohive"]

[project]
name = "neurohive"
version = "0.1.0"
description = "RAG pipeline for grounded neuroscience Q&A over a taxonomy graph and paper corpus"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.104.1",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0.0",
]
nli = [
    "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = [
    "ipykernel",
    "matplotlib>=3.10.9",
    "networkx>=3.6.1",
]
